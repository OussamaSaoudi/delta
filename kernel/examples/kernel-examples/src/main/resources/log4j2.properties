# Root logger: WARN by default to suppress noisy libraries
rootLogger.level = warn
rootLogger.appenderRef.console.ref = Console

# Console appender with timestamp, thread, level, logger, and message
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{1}: %m%n

# Delta Kernel loggers at INFO level
logger.kernel.name = io.delta.kernel
logger.kernel.level = info

logger.storage.name = io.delta.storage
logger.storage.level = info

# Hadoop S3A at WARN to see credential/connection issues
logger.s3a.name = org.apache.hadoop.fs.s3a
logger.s3a.level = warn
